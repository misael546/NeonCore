<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NeonCore · Proyectos</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060c;color:#fff;font-family:Arial,sans-serif}
body{display:grid;place-items:center}.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#102338 0,transparent 45%),linear-gradient(135deg,#02050a,#07111d 55%,#02050a)}
.grid{position:absolute;inset:0;opacity:.2;background-image:linear-gradient(#39e7ff0d 1px,transparent 1px),linear-gradient(90deg,#39e7ff0d 1px,transparent 1px);background-size:40px 40px}
.card{position:relative;z-index:2;width:min(760px,92vw);padding:34px;background:#07101bf7;border:1px solid #39e7ff55;border-radius:22px;box-shadow:0 25px 100px #000}
.back{border:0;background:transparent;color:#71819a;font-size:11px;letter-spacing:1px;cursor:pointer;padding:0}.ey{margin-top:22px;color:#6e819a;font-size:10px;font-weight:900;letter-spacing:4px}.brand{margin:8px 0;color:#efffff;font-size:34px;letter-spacing:5px;text-shadow:0 0 12px #39e7ff}.sub{color:#91a2b8;font-size:12px;letter-spacing:2px;font-weight:900;margin-bottom:24px}
.project{padding:20px;border:1px solid #39e7ff55;border-radius:15px;background:linear-gradient(135deg,#0a1725,#07101a)}.project h2{margin:0;color:#dffbff;font-size:22px;letter-spacing:2px}.project p{color:#8ea0b8;font-size:12px;line-height:1.5;margin:8px 0 0}.tag{display:inline-block;margin-top:12px;padding:5px 8px;border:1px solid #33415d;border-radius:7px;color:#7f91aa;font-size:9px;letter-spacing:1px}
button.open{width:100%;height:50px;margin-top:18px;border:1px solid #39e7ff;border-radius:10px;background:linear-gradient(135deg,#0d3044,#15536a);color:#fff;font-weight:900;letter-spacing:1px;cursor:pointer}
</style>
</head>
<body><div class="bg"></div><div class="grid"></div>
<main class="card">
<button class="back" id="back">← PORTAL PRINCIPAL</button>
<div class="ey">PROYECTOS DE SOFTWARE</div>
<div class="brand">PROYECTOS</div>
<div class="sub">PROYECTOS DISPONIBLES EN DESARROLLO</div>
<section class="project">
<h2>NEONCORE</h2>
<p>Proyecto web multijugador en desarrollo. Esta entrada abre directamente el entorno de prueba del proyecto.</p>
<span class="tag">SOFTWARE · WEB · MULTIPLAYER</span>
<button class="open" id="open">ABRIR PROYECTO</button>
</section>
</main>
<script>
document.getElementById("back").onclick=function(){location.href="/NeonCore/";};
document.getElementById("open").onclick=function(){location.href="/NeonCore/neoncore/12345/V1/index.html";};
</script>
</body>
</html>
