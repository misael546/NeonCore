name: Apply NeonCore update prompt fix

on:
  push:
    branches: [main]

jobs:
  patch:
    if: !contains(github.event.head_commit.message, '[update-prompt-applied]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch client update prompt
        shell: python
        run: |
          from pathlib import Path

          client = Path("neoncore/12345/v172/index.html")
          test = Path(".github/tests/neoncore-menu-smoke.spec.js")

          s = client.read_text(encoding="utf-8")
          old_build = 'var v="20261003-019-remove-hud-kills";'
          new_build = 'var v="20261003-020-update-prompt";'
          assert old_build in s, "Build 019 no encontrado"
          s = s.replace(old_build, new_build, 1)

          old_check = '''        var m=html.match(/window\\.NEON_CORE_BUILD\\s*=\\s*"([^"]+)"/);
          if(m && m[1]!==window.NEON_CORE_BUILD) location.reload();'''
          new_check = '''        var m=html.match(/window\\.NEON_CORE_BUILD\\s*=\\s*"([^"]+)"/);
          if(m && m[1]!==window.NEON_CORE_BUILD){
            window.__NEON_PENDING_BUILD_UPDATE=m[1];
            if(typeof window.showServerUpdateNotice==="function"){
              window.showServerUpdateNotice("Hay una nueva versión de Neon Core. Pulsa ACTUALIZAR AHORA para cargarla.");
            }
          }'''
          assert old_check in s, "Comprobador de build no encontrado"
          s = s.replace(old_check, new_check, 1)

          old_interval = 'setInterval(checkRenderStatus,8000);'
          assert old_interval in s, "Intervalo del monitor no encontrado"
          s = s.replace(old_interval, 'setInterval(checkRenderStatus,2500);', 1)

          old_hook = '''  wrap.style.display="flex";
          }
          async function checkRenderStatus(){'''
          new_hook = '''  wrap.style.display="flex";
          }
          window.showServerUpdateNotice=showServerUpdateNotice;
          if(window.__NEON_PENDING_BUILD_UPDATE) setTimeout(()=>showServerUpdateNotice("Hay una nueva versión de Neon Core. Pulsa ACTUALIZAR AHORA para cargarla."),0);
          async function checkRenderStatus(){'''
          assert old_hook in s, "Hook del aviso no encontrado"
          s = s.replace(old_hook, new_hook, 1)

          client.write_text(s, encoding="utf-8")

          t = test.read_text(encoding="utf-8")
          assert "20261003-019-remove-hud-kills" in t, "Smoke test no está en 019"
          t = t.replace("20261003-019-remove-hud-kills", "20261003-020-update-prompt", 1)
          test.write_text(t, encoding="utf-8")

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-update-prompt-once.yml
          git add neoncore/12345/v172/index.html .github/tests/neoncore-menu-smoke.spec.js .github/workflows/apply-update-prompt-once.yml
          git commit -m "Apply update prompt fix [update-prompt-applied]"
          git push
