name: Neon Core browser test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages current version
        run: |
          expected="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          for i in $(seq 1 30); do
            live="$(curl -fsSL "https://misael546.github.io/NeonCore/release.json?ci=$i" || true)"
            if grep -Fq "\"version\": \"$expected\"" <<<"$live"; then
              echo "NeonCore current release is public: $expected"
              exit 0
            fi
            sleep 5
          done
          echo "NeonCore current release was not detected"
          exit 1

      - name: Wait for Render server current version
        run: |
          expected="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["serverVersion"])')"
          for i in $(seq 1 36); do
            if curl -fsSL "https://neon-core-multiplayer.onrender.com/health?ci=$i" | grep -Fq "\"version\":\"$expected\""; then
              echo "Render server is live: $expected"
              exit 0
            fi
            sleep 5
          done
          echo "Render server was not detected"
          exit 1

      - name: Run live browser tests
        run: npx playwright test .github/tests/neoncore-browser.spec.js --workers=1

      - name: Upload browser artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: neoncore-browser-artifacts
          path: |
            test-results/
            playwright-report/
