name: Apply NeonCore update prompt fix v2

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply update prompt fix v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch update notification
        shell: python
        run: |
          from pathlib import Path

          client = Path("neoncore/12345/v172/index.html")
          s = client.read_text(encoding="utf-8")

          s = s.replace(
              'var v="20261003-019-remove-hud-kills";',
              'var v="20261003-020-update-prompt";',
              1
          )

          old_line = 'if(m && m[1]!==window.NEON_CORE_BUILD) location.reload();'
          new_block = '''if(m && m[1]!==window.NEON_CORE_BUILD){
            window.__NEON_PENDING_BUILD_UPDATE=m[1];
            if(typeof window.showServerUpdateNotice==="function"){
              window.showServerUpdateNotice("Hay una nueva versión de Neon Core. Pulsa ACTUALIZAR AHORA para cargarla.");
            }
          }'''
          assert old_line in s, "Línea de recarga de build no encontrada"
          s = s.replace(old_line, new_block, 1)

          s = s.replace(
              'setInterval(checkRenderStatus,8000);',
              'setInterval(checkRenderStatus,2500);',
              1
          )

          needle = 'async function checkRenderStatus(){'
          insert = '''window.showServerUpdateNotice=showServerUpdateNotice;
          if(window.__NEON_PENDING_BUILD_UPDATE) setTimeout(()=>showServerUpdateNotice("Hay una nueva versión de Neon Core. Pulsa ACTUALIZAR AHORA para cargarla."),0);
          async function checkRenderStatus(){'''
          assert needle in s, "Monitor de Render no encontrado"
          s = s.replace(needle, insert, 1)

          client.write_text(s, encoding="utf-8")

          marker = '20261003-019-remove-hud-kills'
          for p in Path(".github").rglob("*"):
              if p.is_file() and p.suffix in {".js", ".yml", ".yaml"}:
                  try:
                      t = p.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if marker in t:
                      p.write_text(t.replace(marker, '20261003-020-update-prompt'), encoding="utf-8")

      - name: Commit patched client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-update-prompt-once.yml .github/workflows/apply-update-prompt-once-v2.yml
          git add neoncore/12345/v172/index.html .github
          git commit -m "Apply update prompt fix v2"
          git push
