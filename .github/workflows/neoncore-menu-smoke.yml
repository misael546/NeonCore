name: Neon Core menu smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages current version
        run: |
          expected="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          for i in $(seq 1 30); do
            live="$(curl -fsSL "https://misael546.github.io/NeonCore/release.json?menuSmokeCI=$i" || true)"
            if grep -Fq "\"version\": \"$expected\"" <<<"$live"; then
              echo "NeonCore current release is public: $expected"
              exit 0
            fi
            sleep 5
          done
          echo "NeonCore current release was not detected"
          exit 1
      - name: Wait for Render current version
        run: |
          expected="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["serverVersion"])')"
          for i in $(seq 1 36); do
            if curl -fsSL "https://neon-core-multiplayer.onrender.com/health?menuSmokeCI=$i" | grep -Fq "\"version\":\"$expected\""; then
              echo "Render server is live: $expected"
              exit 0
            fi
            sleep 5
          done
          echo "Render server was not detected"
          exit 1
      - name: Run menu smoke test
        run: npx playwright test .github/tests/neoncore-menu-smoke.spec.js --workers=1
