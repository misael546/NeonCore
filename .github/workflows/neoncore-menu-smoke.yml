name: DarkPixel Online menu smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages current version
        run: |
          expected="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          for i in $(seq 1 30); do
            live="$(curl -fsSL "https://misael546.github.io/NeonCore/release.json?menuSmokeCI=$i" || true)"
            if grep -Fq "\"version\": \"$expected\"" <<<"$live"; then
              echo "DarkPixel Online current release is public: $expected"
              exit 0
            fi
            sleep 5
          done
          echo "DarkPixel Online current release was not detected"
          exit 1
      - name: Wait for Belmo current version
        run: |
          expected="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["serverVersion"])')"
          for i in $(seq 1 36); do
            if curl -fsSL "https://neoncore-da6f.onbelmo.uk/health?menuSmokeCI=$i" | grep -Fq "\"version\":\"$expected\""; then
              echo "Belmo server is live: $expected"
              exit 0
            fi
            sleep 5
          done
          echo "Belmo server was not detected"
          exit 1
      - name: Verify Belmo Google configuration
        run: |
          cfg="$(curl -fsSL "https://neoncore-da6f.onbelmo.uk/auth/google/config?menuSmokeGoogleCI=1")"
          node -e 'const c=JSON.parse(process.argv[1]); if(!c.ok || !String(c.clientId||"").trim()) { console.error("Belmo Google configuration is missing or invalid."); process.exit(1); } console.log("Belmo Google configuration: OK");' "$cfg"
      - name: Run menu smoke test
        run: npx playwright test .github/tests/neoncore-menu-smoke.spec.js --workers=1
