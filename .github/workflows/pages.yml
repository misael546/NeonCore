name: Deploy Neon Core to GitHub Pages
# Force Pages refresh from current main branch — 20261003-008

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Neon Core JavaScript
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check requests
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          targets = [
              Path("neoncore/12345/v167/index.html"),
              Path("index.html"),
              Path("neoncore/index.html"),
          ]
          for path in targets:
              html = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:[^>]*)>([\s\S]*?)</script>", html, flags=re.I)
              checked = 0
              for i, code in enumerate(scripts):
                  if not code.strip():
                      continue
                  tmp = Path(tempfile.gettempdir()) / f"neoncore_{i}.js"
                  tmp.write_text(code, encoding="utf-8")
                  subprocess.run(["node", "--check", str(tmp)], check=True)
                  checked += 1
              print(f"{path}: {checked} scripts OK")
          PY

      - name: Verify official entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          import json
          root = Path("index.html").read_text(encoding="utf-8")
          legacy = Path("neoncore/index.html").read_text(encoding="utf-8")
          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          expected_release = str(release["clientBuild"])

          assert expected_release in root
          assert 'MENÚ PRINCIPAL' in root
          assert 'id="name"' in root
          assert 'id="play"' in root
          assert './neoncore/12345/v172/?name=' in root
          assert 'PUBLIC_ROOM_CODE' not in root
          assert 'Sala #1' not in root
          assert '20261003-167-darkscifi' not in root
          assert 'location.replace(target+q)' in legacy

          print("[PAGES] Official root verified: current main menu.")
          print("[PAGES] Legacy neoncore route redirects to official root.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages content
        shell: bash
        run: |
          set -euo pipefail
          expected_release="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["clientBuild"])')"
          url="https://misael546.github.io/NeonCore/?livecheck=$(date +%s%N)"
          echo "[PAGES] Expected release: $expected_release"
          echo "[PAGES] Checking live URL: $url"
          for i in $(seq 1 12); do
            html="$(curl -fsSL --retry 2 --retry-delay 2 "$url" || true)"
            if grep -Fq '20261003-016-jugar-v172-sala-1' <<<"$html" \
               && grep -Eq 'PUBLIC_ROOM_CODE' <<<"$html" \
               && ! grep -Fq 'MENÚ PRINCIPAL · SALAS PÚBLICAS' <<<"$html" \
               && ! grep -Fq '20261003-167-darkscifi' <<<"$html"; then
              echo "[PAGES] LIVE ROOT VERIFIED: current standalone main menu is being served."
              exit 0
            fi
            echo "[PAGES] Live root check $i/12 did not match current build; waiting..."
            sleep 5
          done
          echo "[PAGES] LIVE ROOT CHECK FAILED."
          printf '%s' "${html:0:1200}"
          exit 1
