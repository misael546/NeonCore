name: Deploy Neon Core to GitHub Pages
# Force Pages refresh from current main branch — 20261004-039-force-redeploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply BUILD-22 combat tuning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          BUILD = "BUILD-22"
          FIRE_RATE = 650
          FIRST_SHOT_DELAY = 180

          release_path = Path("release.json")
          release = json.loads(release_path.read_text(encoding="utf-8"))
          release["releaseId"] = BUILD
          release["clientBuild"] = BUILD
          release["serverBuild"] = BUILD
          release["clientPath"] = "neoncore/12345/v1/index.html"
          release_path.write_text(json.dumps(release, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")

          server_path = Path("server/server.js")
          server = server_path.read_text(encoding="utf-8")
          server = server.replace("BUILD-20", BUILD).replace("BUILD-21", BUILD)
          server = server.replace("Build 20", "Build 22").replace("Build 21", "Build 22")
          server = server.replace("BUILD 20", "BUILD 22").replace("BUILD 21", "BUILD 22")
          server = server.replace("const WEAPON_FIRE_RATE = 420;", f"const WEAPON_FIRE_RATE = {FIRE_RATE};")
          server = server.replace("fireRate: 420", f"fireRate: {FIRE_RATE}")
          server_path.write_text(server, encoding="utf-8")

          client_path = Path("neoncore/12345/v1/index.html")
          client = client_path.read_text(encoding="utf-8")
          client = client.replace("BUILD-20", BUILD).replace("BUILD-21", BUILD)
          client = client.replace("Build 20", "Build 22").replace("Build 21", "Build 22")
          client = client.replace("BUILD 20", "BUILD 22").replace("BUILD 21", "BUILD 22")
          client = client.replace("fireRate:420", f"fireRate:{FIRE_RATE}")
          client = client.replace("p.fireRate=420", f"p.fireRate={FIRE_RATE}")

          client = client.replace("pointer.down=true;", "setFireHeld(true);")
          client = client.replace("pointer.down=false;", "setFireHeld(false);")

          if "function setFireHeld(held)" not in client:
              marker = 'const pointer={x:W/2,y:H/2,down:false}; let moveX=0,moveY=0;'
              helper = marker + f'''
const FIRST_SHOT_DELAY={FIRST_SHOT_DELAY};
let fireHoldStartedAt=0,fireTriggerActive=false;
function setFireHeld(held){{
  const next=!!held;
  if(next&&!pointer.down){{
    fireTriggerActive=true;
    fireHoldStartedAt=performance.now();
  }}
  if(!next){{
    fireTriggerActive=false;
    fireHoldStartedAt=0;
  }}
  pointer.down=next;
}}'''
              if marker not in client:
                  raise SystemExit("client pointer marker not found")
              client = client.replace(marker, helper, 1)

          old_fire = '''const now=performance.now();
  if(now-p.lastShot<p.fireRate)return;'''
          new_fire = f'''const now=performance.now();
  if(fireTriggerActive&&now-fireHoldStartedAt<FIRST_SHOT_DELAY)return;
  if(now-p.lastShot<p.fireRate)return;'''
          if old_fire not in client:
              raise SystemExit("client fire block not found")
          client = client.replace(old_fire, new_fire, 1)
          client = client.replace("fireRate:420,lastShot:0", f"fireRate:{FIRE_RATE},lastShot:0", 1)
          client = client.replace("p.fireRate=420;", f"p.fireRate={FIRE_RATE};")
          client = client.replace(
              '@media(min-width:800px){.aimJoy{display:none!important}}',
              'html.pc-controls .aimJoy{display:none!important}html.touch-controls .aimJoy{display:block!important}'
          )
          client_path.write_text(client, encoding="utf-8")

          validation = Path(".github/workflows/neoncore-validation.yml")
          if validation.exists():
              v = validation.read_text(encoding="utf-8")
              v = v.replace("neoncore/12345/index.html", "neoncore/12345/v1/index.html")
              v = v.replace("20261003-016-jugar-v172-sala-1", BUILD)
              v = v.replace("BUILD-20", BUILD).replace("BUILD-21", BUILD)
              v = v.replace("SERVER_VERSION\\\\s*=\\\\s*['\\\"]2['\\\"]", "BUILD-22")
              validation.write_text(v, encoding="utf-8")

          for temporary in [
              Path(".github/workflows/neoncore-build22-sync.yml"),
              Path(".github/workflows/neoncore-build22-run.yml"),
              Path(".github/workflows/neoncore-build21-sync.yml"),
              Path("neoncore/12345/v1/build21.html"),
          ]:
              if temporary.exists():
                  temporary.unlink()

          print("[BUILD-22] combat tuning applied:", FIRE_RATE, "ms cadence,", FIRST_SHOT_DELAY, "ms first-shot delay")
          PY

      - name: Verify BUILD-22 combat tuning
        shell: bash
        run: |
          grep -q '"clientBuild": "BUILD-22"' release.json
          grep -q "const WEAPON_FIRE_RATE = 650" server/server.js
          grep -q "fireRate: 650" server/server.js
          grep -q "FIRST_SHOT_DELAY=180" neoncore/12345/v1/index.html
          grep -q "setFireHeld(true)" neoncore/12345/v1/index.html
          grep -q "setFireHeld(false)" neoncore/12345/v1/index.html

      - name: Commit synchronized BUILD-22
        shell: bash
        run: |
          git config user.name "neon-core-release[bot]"
          git config user.email "neon-core-release[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "BUILD-22 is already synchronized."
          else
            git commit -m "BUILD-22: cadencia global y primer disparo controlado [skip ci]"
            git push
          fi

      - name: Validate Neon Core JavaScript
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check requests
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          targets = [
              Path("neoncore/12345/v1/index.html"),
              Path("index.html"),
              Path("neoncore/index.html"),
          ]
          for path in targets:
              html = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:[^>]*)>([\s\S]*?)</script>", html, flags=re.I)
              checked = 0
              for i, code in enumerate(scripts):
                  if not code.strip():
                      continue
                  tmp = Path(tempfile.gettempdir()) / f"neoncore_{i}.js"
                  tmp.write_text(code, encoding="utf-8")
                  subprocess.run(["node", "--check", str(tmp)], check=True)
                  checked += 1
              print(f"{path}: {checked} scripts OK")
          PY

      - name: Verify official entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          import json
          root = Path("index.html").read_text(encoding="utf-8")
          legacy = Path("neoncore/index.html").read_text(encoding="utf-8")
          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          expected_release = str(release["clientBuild"])

          assert expected_release in root
          assert 'MENÚ PRINCIPAL' in root
          assert 'id="name"' in root
          assert 'id="play"' in root
          assert './neoncore/12345/v1/?name=' in root
          assert 'PUBLIC_ROOM_CODE' not in root
          assert 'Sala #1' not in root
          assert '20261003-167-darkscifi' not in root
          assert 'location.replace(target+q)' in legacy

          print("[PAGES] Official root verified: current main menu.")
          print("[PAGES] Legacy neoncore route redirects to official root.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages content
        shell: bash
        run: |
          set -euo pipefail
          expected_release="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["clientBuild"])')"
          url="https://misael546.github.io/NeonCore/?livecheck=$(date +%s%N)"
          echo "[PAGES] Expected release: $expected_release"
          echo "[PAGES] Checking live URL: $url"
          for i in $(seq 1 12); do
            html="$(curl -fsSL --retry 2 --retry-delay 2 "$url" || true)"
            if grep -Fq "$expected_release" <<<"$html" \
               && grep -Fq 'id="name"' <<<"$html" \
               && grep -Fq 'id="play"' <<<"$html" \
               && grep -Fq './neoncore/12345/v1/?name=' <<<"$html" \
               && ! grep -Fq 'PUBLIC_ROOM_CODE' <<<"$html" \
               && ! grep -Fq '20261003-167-darkscifi' <<<"$html"; then
              echo "[PAGES] LIVE ROOT VERIFIED: current standalone main menu is being served."
              exit 0
            fi
            echo "[PAGES] Live root check $i/12 did not match current build; waiting..."
            sleep 5
          done
          echo "[PAGES] LIVE ROOT CHECK FAILED."
          printf '%s' "${html:0:1200}"
          exit 1
