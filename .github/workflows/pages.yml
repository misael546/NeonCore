name: Deploy Neon Core to GitHub Pages
# Release-driven Pages deployment — no hardcoded version number

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Neon Core JavaScript
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check requests
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json

          targets = [
              Path(json.loads(Path("release.json").read_text(encoding="utf-8"))["clientPath"].lstrip("/")),
              Path("index.html"),
              Path("proyectos/index.html"),
          ]
          for path in targets:
              html = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:[^>]*)>([\s\S]*?)</script>", html, flags=re.I)
              checked = 0
              for i, code in enumerate(scripts):
                  if not code.strip():
                      continue
                  tmp = Path(tempfile.gettempdir()) / f"neoncore_{i}.js"
                  tmp.write_text(code, encoding="utf-8")
                  subprocess.run(["node", "--check", str(tmp)], check=True)
                  checked += 1
              print(f"{path}: {checked} scripts OK")
          for server_file in ["server/server.js", "server/cosmetics.js", "server/storage.js", "server/google-auth.js"]:
              subprocess.run(["node", "--check", server_file], check=True)
              print(f"{server_file}: syntax OK")
          PY

      - name: Verify official entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          import json
          root = Path("index.html").read_text(encoding="utf-8")
          projects = Path("proyectos/index.html").read_text(encoding="utf-8")
          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          expected_release = str(release["version"])

          expected_path = str(release["clientPath"]).lstrip("/")
          assert "NEONCORE" in root
          assert "/NeonCore/proyectos/" in root
          assert "V1" not in root and "V2" not in root and "BUILD-" not in root
          assert "DarkPixel Online" in projects
          assert Path(expected_path).exists()

          print("[PAGES] Official NeonCore portal and protected Projects entry verified.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages content
        shell: bash
        run: |
          set -euo pipefail
          expected_release="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          expected_path="$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["clientPath"].removeprefix("/NeonCore/"))')"
          url="https://misael546.github.io/NeonCore/?livecheck=$(date +%s%N)"
          echo "[PAGES] Expected release: $expected_release"
          echo "[PAGES] Checking live URL: $url"
          for i in $(seq 1 12); do
            html="$(curl -fsSL --retry 2 --retry-delay 2 "$url" || true)"
            client="$(curl -fsSL --retry 2 --retry-delay 2 "https://misael546.github.io/NeonCore/${expected_path}?livecheck=$(date +%s%N)" || true)"
            if grep -Fq 'NEONCORE' <<<"$html" \
               && grep -Fq "/NeonCore/proyectos/" <<<"$html" \
               && grep -Fq "var v=\"$expected_release\"" <<<"$client" \
               && grep -Fq "wss://neoncore-da6f.onbelmo.uk/ws" <<<"$client" \
               && grep -Fq "/auth/google/config" <<<"$client" \
               && grep -Fq "https://accounts.google.com/gsi/client" <<<"$client" \
               && ! grep -Fq 'PUBLIC_ROOM_CODE' <<<"$html" \
               && ! grep -Fq 'BUILD-' <<<"$html"; then
              echo "[PAGES] LIVE ROOT VERIFIED: current standalone main menu is being served."
              exit 0
            fi
            echo "[PAGES] Live root check $i/12 did not match current version; waiting..."
            sleep 5
          done
          echo "[PAGES] LIVE ROOT CHECK FAILED."
          printf '%s' "${html:0:1200}"
          exit 1
