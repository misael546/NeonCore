name: DarkPixel Online validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server.js
      - name: Check storage syntax
        run: node --check storage.js
      - name: Check cosmetics syntax
        run: node --check cosmetics.js
      - name: Check Neon Core client syntax
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('release.json','utf8'));
          const currentClient = String(release.clientPath || '').replace(/^\/+/,'');
          const files = [currentClient, 'index.html', 'proyectos/index.html'];
          let total = 0;
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const matches = [...html.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/gi)];
            for (const match of matches) if (match[1].trim()) { new Function(match[1]); total++; }
            if (!matches.length) console.log(file + ': no inline script tags; skipped syntax check');
            else console.log(file + ': OK');
          }
          console.log('Checked '+total+' inline script block(s).');
          NODE

      - name: Verify current complete release synchronization
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('release.json','utf8'));
          const root = fs.readFileSync('index.html','utf8');
          const projects = fs.readFileSync('proyectos/index.html','utf8');
          const clientPath = String(release.clientPath || '').replace(/^\/+/,'');
          const client = fs.readFileSync(clientPath,'utf8');
          const server = fs.readFileSync('server/server.js','utf8');
          const cosmetics = fs.readFileSync('server/cosmetics.js','utf8');
          const version = String(release.version || release.clientVersion || release.releaseId || '').toUpperCase();
          const clientMarker = client.match(/\bvar\s+v\s*=\s*["']([^"']+)["']/)?.[1]
            || client.match(/window\.NEON_CORE_VERSION\s*=\s*["']([^"']+)["']/)?.[1] || '';

          if (!/^V([1-9][0-9]*)$/.test(version)) throw new Error('Invalid release version: '+version);
          if (clientMarker !== version) throw new Error('Client version mismatch: '+clientMarker+' vs '+version);
          if (release.version !== version || release.releaseId !== version || release.clientVersion !== version || Number(release.databaseSchema) !== 3) {
            throw new Error('release.json client metadata is not internally synchronized');
          }
          if (!root.includes('NEONCORE') || !root.includes('VIEW PROJECTS') || !projects.includes('DarkPixel Online')) {
            throw new Error('Main portal / Projects portal is not synchronized');
          }
          const expectedPath = 'proyectos/darkpixel-online/index.html';
          if (clientPath !== expectedPath) throw new Error('Invalid current client path: '+clientPath);
          if (!projects.includes('/NeonCore/proyectos/darkpixel-online/')) throw new Error('Projects entry does not target DarkPixel Online');
          if (!client.includes('DARKPIXEL ONLINE') || !client.includes('account_authenticated') || !client.includes('SPECIAL')) throw new Error('DarkPixel Online client systems are not synchronized');
          if (!server.includes('MELEE_GRID_SIZE = 24') || !server.includes('SPECIAL_COOLDOWN_MS = 3000') || !server.includes('SPECIAL_ATTACK_FATIGUE = 20') || !cosmetics.includes('NEONMASTER')) throw new Error('Server mechanics are not synchronized');
          for (const legacy of ['V80','V81','Pistolero','MUNICIÓN','neon_release','neon_force','neon_reload','buy_ammo']) {
            if (client.includes(legacy) || server.includes(legacy) || cosmetics.includes(legacy)) throw new Error('Legacy trace found: '+legacy);
          }
          const indexFiles=[];
          function collectIndexFiles(dir){
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              const full=require('path').join(dir,e.name);
              if(e.isDirectory() && !['.git','node_modules'].includes(e.name)) collectIndexFiles(full);
              else if(e.isFile() && e.name==='index.html') indexFiles.push(full.replaceAll(require('path').sep,'/'));
            }
          }
          collectIndexFiles('.');
          const expectedIndexes=['index.html','proyectos/index.html','proyectos/darkpixel-online/index.html'].sort();
          const actualIndexes=indexFiles.filter(x=>!x.startsWith('.git/')).sort();
          if(JSON.stringify(actualIndexes)!==JSON.stringify(expectedIndexes)) throw new Error('Index files mismatch: '+JSON.stringify(actualIndexes));
          if (!client.includes('DEFAULT_MELEE_SKIN') || !server.includes("backpack_basic")) throw new Error('Inventory/skin systems are not synchronized');
          console.log('Current complete release synchronization: OK -> '+version);
          NODE
