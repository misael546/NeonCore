name: Neon Core validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server.js
      - name: Check storage syntax
        run: node --check storage.js
      - name: Check cosmetics syntax
        run: node --check cosmetics.js
      - name: Check Neon Core client syntax
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'neoncore/12345/index.html'
          ];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const matches = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (!matches.length) throw new Error(file + ': no inline script found');
            new Function(matches[matches.length - 1][1]);
            console.log(file + ': OK');
          }
          NODE

      - name: Verify build synchronization
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const root = fs.readFileSync('index.html','utf8');
          const sessions = fs.readFileSync('sessions/index.html','utf8');
          const server = fs.readFileSync('server/server.js','utf8');
          if (!/var\s+v\s*=\s*["']20261003-016-jugar-v172-sala-1["']/.test(root)) throw new Error('Root build marker is not current');
          if (!root.includes('id="username"') || !root.includes('MENÚ PRINCIPAL') || !root.includes('> JUGAR</button>') || root.includes('SESIONES MULTIJUGADOR')) throw new Error('Main menu is not synchronized for Session 1');
          if (!sessions.includes('Neon Core · Sesiones') || !sessions.includes('const WS=')) throw new Error('Sessions page is not synchronized');
          if (!/SERVER_VERSION\s*=\s*['"]2['"]/.test(server)) throw new Error('Server version is not 2');
          console.log('Build synchronization: OK');
          NODE
