name: Neon Core validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server.js
      - name: Check storage syntax
        run: node --check storage.js
      - name: Check cosmetics syntax
        run: node --check cosmetics.js
      - name: Check Neon Core client syntax
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'neoncore/12345/v1/index.html',
            'index.html',
            'sessions/index.html'
          ];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const matches = [...html.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/gi)];
            for (const match of matches) {
              if (match[1].trim()) new Function(match[1]);
            }
            if (!matches.length) throw new Error(file + ': no inline script found');
            console.log(file + ': OK');
          }
          NODE

      - name: Verify BUILD-29 synchronization
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('release.json','utf8'));
          const root = fs.readFileSync('index.html','utf8');
          const sessions = fs.readFileSync('sessions/index.html','utf8');
          const client = fs.readFileSync('neoncore/12345/v1/index.html','utf8');
          const server = fs.readFileSync('server/server.js','utf8');

          const build = String(release.clientBuild || '');
          if (build !== 'BUILD-29' || release.releaseId !== 'BUILD-29' || release.serverBuild !== 'BUILD-29' || Number(release.databaseSchema) !== 3) {
            throw new Error('release.json is not BUILD-29');
          }
          if (!root.includes('BUILD-29') || !root.includes('id="name"') || !root.includes('id="play"')) {
            throw new Error('Main menu is not BUILD-29');
          }
          if (!sessions.includes('Neon Core · Sesiones') || !sessions.includes('const WS=')) {
            throw new Error('Sessions page is not synchronized');
          }
          if (!client.includes('BUILD-29') || !client.includes('FIRST_SHOT_DELAY=180') || !client.includes('fireRate:650') || !client.includes('account_authenticated')) {
            throw new Error('Client combat tuning is not synchronized');
          }
          if (!server.includes('BUILD-29') || !server.includes('const WEAPON_FIRE_RATE = 650') || !server.includes('fireRate: 650') || !server.includes('account_authenticated')) {
            throw new Error('Server combat tuning is not synchronized');
          }
          console.log('BUILD-29 synchronization: OK');
          NODE
