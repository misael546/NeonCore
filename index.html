<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
(function(){window.NEON_CORE_BUILD="20261003-032-dead-player-render-fix";})();
</script>
<title>Neon Core · Menú Principal</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#fff;font-family:Arial,sans-serif}
body{display:grid;place-items:center}
.bg{position:fixed;inset:0;background:
radial-gradient(circle at 50% 38%,rgba(15,54,78,.38),transparent 40%),
linear-gradient(135deg,#02050b 0%,#07101d 48%,#02050b 100%)}
.grid{position:absolute;inset:0;opacity:.22;background-image:
linear-gradient(rgba(57,231,255,.05) 1px,transparent 1px),
linear-gradient(90deg,rgba(57,231,255,.05) 1px,transparent 1px);
background-size:38px 38px}
.card{position:relative;z-index:2;width:min(560px,94vw);padding:30px 28px 24px;background:linear-gradient(180deg,rgba(10,20,35,.98),rgba(4,10,19,.99));border:1px solid #39e7ff66;border-radius:22px;box-shadow:0 25px 100px #000,0 0 45px #39e7ff18,inset 0 0 45px #39e7ff09}
.eyebrow{text-align:center;color:#6d819d;font-size:10px;font-weight:900;letter-spacing:4px;margin-bottom:8px}
h1{margin:0;text-align:center;font-size:42px;letter-spacing:7px;color:#e9fdff;text-shadow:0 0 10px #39e7ff,0 0 32px #39e7ff55}
.sub{text-align:center;color:#8ea0b8;font-size:12px;letter-spacing:3px;font-weight:900;margin:8px 0 22px}
label{display:block;color:#a9b8cc;font-size:10px;font-weight:900;letter-spacing:2px;margin:0 0 7px}
input{width:100%;height:50px;padding:0 15px;background:#060e1a;border:1px solid #2a405c;border-radius:10px;font-size:16px;color:#fff;outline:none}
input:focus{border-color:#39e7ff;box-shadow:0 0 0 2px #39e7ff18,0 0 22px #39e7ff12,inset 0 0 18px #0008}
button{width:100%;height:52px;margin-top:12px;border:1px solid #39e7ff;border-radius:11px;background:linear-gradient(135deg,#0d3044,#15536a);color:#fff;font-size:15px;font-weight:900;letter-spacing:1px;box-shadow:0 0 22px #39e7ff18,0 8px 24px #000}
button:active{transform:scale(.985)}
button span{margin-right:7px}
.msg{min-height:18px;margin:9px 0 0;text-align:center;color:#7f91aa;font-size:11px}
.foot{display:flex;justify-content:center;gap:10px;margin-top:18px;color:#53627b;font-size:9px;letter-spacing:1.5px}
@media(max-width:600px){.card{width:min(430px,94vw);padding:25px 18px 18px}h1{font-size:31px;letter-spacing:5px}.sub{font-size:10px}input{height:48px}button{height:50px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<main class="card">
  <div class="eyebrow">NEON CORE // ONLINE</div>
  <h1>NEON CORE</h1>
  <div class="sub">MENÚ PRINCIPAL</div>
  <label for="name">NOMBRE DEL TANQUE</label>
  <input id="name" maxlength="20" autocomplete="nickname" placeholder="Escribe tu nombre">
  <div id="msg" class="msg">Escribe tu nombre para entrar a la Sesión 1.</div>
  <button id="play" type="button"><span>▶</span>JUGAR</button>
  <div class="foot"><span>SESIÓN 1</span><span>•</span><span>BUILD 031</span></div>
</main>
<script>
(function(){
  const input=document.getElementById("name");
  const button=document.getElementById("play");
  const msg=document.getElementById("msg");
  const key="neon_core_player_name";
  try{input.value=(localStorage.getItem(key)||"").slice(0,20);}catch{}
  function enter(){
    const n=String(input.value||"").trim().slice(0,20);
    if(!n){msg.textContent="Escribe tu nombre para entrar.";input.focus();return;}
    try{localStorage.setItem(key,n);}catch{}
    msg.textContent="Entrando a Sesión 1…";
    const url="./neoncore/12345/v172/?name="+encodeURIComponent(n);
    window.location.assign(url);
  }
  button.addEventListener("click",enter);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();enter();}});
})();
</script>
</body>
</html>
