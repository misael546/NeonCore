<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NeonCore · Portal de Desarrollo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060c;color:#fff;font-family:Arial,sans-serif}
body{display:grid;place-items:center}.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#102338 0,transparent 45%),linear-gradient(135deg,#02050a,#07111d 55%,#02050a)}
.grid{position:absolute;inset:0;opacity:.2;background-image:linear-gradient(#39e7ff0d 1px,transparent 1px),linear-gradient(90deg,#39e7ff0d 1px,transparent 1px);background-size:40px 40px}
.card{position:relative;z-index:2;width:min(720px,92vw);padding:42px 34px 32px;background:#07101bf7;border:1px solid #39e7ff55;border-radius:22px;box-shadow:0 25px 100px #000,inset 0 0 50px #39e7ff08}
.ey{text-align:center;color:#6e819a;font-size:10px;font-weight:900;letter-spacing:4px}.brand{text-align:center;margin:12px 0 6px;font-size:42px;letter-spacing:7px;color:#efffff;text-shadow:0 0 12px #39e7ff,0 0 30px #39e7ff44}.sub{text-align:center;color:#91a2b8;font-size:12px;letter-spacing:3px;font-weight:900;margin-bottom:30px}
.section{border:1px solid #263951;border-radius:14px;padding:18px;background:#081320cc}.section h2{margin:0;color:#dffbff;font-size:16px;letter-spacing:2px}.section p{margin:8px 0 0;color:#7f91aa;font-size:12px;line-height:1.5}
button{width:100%;height:54px;margin-top:18px;border:1px solid #39e7ff;border-radius:11px;background:linear-gradient(135deg,#0d3044,#15536a);color:#fff;font-size:15px;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:0 0 24px #39e7ff18,0 8px 24px #000}button:active{transform:scale(.99)}
.foot{text-align:center;margin-top:20px;color:#53627b;font-size:9px;letter-spacing:2px}
</style>
</head>
<body><div class="bg"></div><div class="grid"></div>
<main class="card">
<div class="ey">NEONCORE // SOFTWARE DEVELOPMENT</div>
<div class="brand">NEONCORE</div>
<div class="sub">PORTAL DE DESARROLLO DE SOFTWARE</div>
<section class="section">
<h2>ENTORNO DE DESARROLLO</h2>
<p>Portal para organizar, consultar y probar los proyectos de software desarrollados en este entorno.</p>
<button id="projects" type="button">PROYECTOS</button>
</section>
<div class="foot">SOFTWARE DEVELOPMENT PORTAL · ONLINE</div>
</main>
<script>
document.getElementById("projects").addEventListener("click",function(){location.href="/NeonCore/proyectos/";});
</script>
</body>
</html>
