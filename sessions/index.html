<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Neon Core · Sesiones</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#050811;color:#fff}
body{display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 15%,#10233b 0,#050811 48%,#02040a 100%)}
.card{width:min(620px,100%);background:rgba(7,13,24,.94);border:1px solid #26344e;border-radius:22px;padding:22px;box-shadow:0 20px 80px #000}
h1{margin:0;color:#39e7ff;letter-spacing:3px;text-shadow:0 0 18px #39e7ff55}
.sub{color:#8ea0b8;margin:6px 0 20px}
label{display:block;color:#9ca9bd;font-size:11px;font-weight:900;letter-spacing:1px;margin:10px 0 6px}
input{width:100%;padding:13px;border:1px solid #33415d;background:#0d1727;color:#fff;border-radius:10px;font-size:16px;outline:none}
.grid{display:grid;gap:10px}.room{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid #263b55;border-radius:13px;background:#0b1524;color:#fff;text-align:left;cursor:pointer}
.room:hover{border-color:#39e7ff;box-shadow:0 0 18px #39e7ff18}.room:disabled{opacity:.45;cursor:not-allowed}
.room b{display:block;color:#dffbff}.room small{color:#8ea0b8}.roomCount{margin-left:auto;color:#6ff3b0;font-size:11px;font-weight:900}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
button{min-height:44px;border:1px solid #33415d;border-radius:10px;background:#183d58;color:#fff;font-weight:900;cursor:pointer}
button.secondary{background:#0d1727}.msg{min-height:20px;margin-top:10px;text-align:center;color:#ff9b9b;font-size:12px}
.sep{height:1px;background:#26344e;margin:18px 0}
.back{margin-top:14px;width:100%;background:#0d1727}
.badge{display:inline-block;margin-left:7px;padding:3px 6px;border:1px solid #26344e;border-radius:6px;color:#74839a;font-size:9px;vertical-align:middle}
@media(max-width:520px){.actions{grid-template-columns:1fr}.card{padding:17px;border-radius:18px}}
</style>
</head>
<body>
<main class="card">
  <h1>NEON CORE <span class="badge">SESIONES</span></h1>
  <div class="sub">Selecciona una sala o crea una sesión privada.</div>

  <label for="username">NOMBRE DEL JUGADOR</label>
  <input id="username" maxlength="20" autocomplete="off" placeholder="Nombre del tanque">

  <div class="sep"></div>
  <label>SALAS PÚBLICAS</label>
  <div id="rooms" class="grid"><div class="room"><b>Cargando salas…</b></div></div>

  <div class="actions">
    <button id="create">CREAR SESIÓN PRIVADA</button>
    <button id="join" class="secondary">UNIRME CON CÓDIGO</button>
  </div>
  <input id="code" maxlength="5" autocomplete="off" placeholder="CÓDIGO DE SESIÓN · EJ. N7K4">
  <div id="msg" class="msg"></div>
  <button id="back" class="back">VOLVER A NEON CORE</button>
</main>
<script>
"use strict";
const BUILD="BUILD-16";
(function(){
  const bust=Date.now()+"-"+Math.random().toString(36).slice(2);
  fetch(new URL("../release.json",location.href).href+"?neon_check="+bust,{cache:"no-store",headers:{"Cache-Control":"no-cache"}})
    .then(r=>{if(!r.ok)throw new Error("manifest "+r.status);return r.json();})
    .then(m=>{
      const remote=String(m.releaseId||m.clientBuild||"");
      if(remote && remote!==BUILD){
        const u=new URL(location.href);
        u.searchParams.set("neon_release",remote);
        u.searchParams.set("neon_force",String(Date.now()));
        location.replace(u.href);
      }
    }).catch(()=>{});
})();
const API="https://neon-core-multiplayer.onrender.com";
const WS=API.replace(/^http/,"ws")+"/ws";
const q=new URLSearchParams(location.search);
const username=document.getElementById("username");
const code=document.getElementById("code");
const rooms=document.getElementById("rooms");
const msg=document.getElementById("msg");
username.value=(q.get("name")||localStorage.getItem("neon_core_player_name")||"").slice(0,20);
function setMsg(t){msg.textContent=t||""}
function nameOk(){const n=username.value.trim().slice(0,20);if(!n){setMsg("Escribe tu nombre primero.");username.focus();return null}localStorage.setItem("neon_core_player_name",n);return n}
function go(room,n){location.href="../?room="+encodeURIComponent(room)+"&name="+encodeURIComponent(n)}
async function loadRooms(){
  try{
    const r=await fetch(API+"/rooms?ci="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("rooms "+r.status);
    const data=await r.json();
    rooms.innerHTML="";
    for(const room of (data.rooms||[])){
      const b=document.createElement("button");
      b.className="room";
      b.dataset.room=room.code;
      b.disabled=room.players>=room.maxPlayers;
      b.innerHTML="<span><b>Sala "+room.code+"</b><small>Sala pública · entrada directa</small></span><span class="roomCount">"+room.players+"/"+room.maxPlayers+" JUGADORES</span>";
      b.addEventListener("click",()=>{const n=nameOk();if(n)go(room.code,n)});
      rooms.appendChild(b);
    }
    if(!rooms.children.length)rooms.innerHTML='<div class="room"><b>No hay salas públicas disponibles.</b></div>';
  }catch(e){
    rooms.innerHTML='<div class="room"><b>No se pudo cargar el listado.</b><small>El servidor puede estar iniciando.</small></div>';
    setMsg("No se pudo consultar el servidor.");
  }
}
function connectForSession(type,value,n){
  setMsg("Conectando con el servidor…");
  const ws=new WebSocket(WS);
  const timer=setTimeout(()=>{try{ws.close()}catch{}setMsg("Tiempo de espera agotado.");},10000);
  ws.addEventListener("open",()=>{
    ws.send(JSON.stringify({type:"join",name:n,saveKey:localStorage.getItem("neon_core_save_key")||""}));
    setTimeout(()=>ws.send(JSON.stringify(type==="create_room"?{type:"create_room"}:{type:"join_room",code:value})),120);
  });
  ws.addEventListener("message",e=>{
    let m;try{m=JSON.parse(e.data)}catch{return}
    if(m.type==="room_joined"){
      clearTimeout(timer);
      try{ws.close()}catch{}
      go(m.code,n);
    }else if(m.type==="room_error"){
      clearTimeout(timer);try{ws.close()}catch{}
      setMsg(m.message||"No se pudo abrir la sesión.");
    }
  });
  ws.addEventListener("error",()=>{clearTimeout(timer);setMsg("No se pudo conectar al servidor.");});
}
document.getElementById("create").addEventListener("click",()=>{
  const n=nameOk();if(n)connectForSession("create_room","",n);
});
document.getElementById("join").addEventListener("click",()=>{
  const n=nameOk();if(!n)return;
  const c=code.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5);
  code.value=c;
  if(!c){setMsg("Escribe el código de la sesión.");code.focus();return}
  connectForSession("join_room",c,n);
});
code.addEventListener("input",()=>code.value=code.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5));
document.getElementById("back").addEventListener("click",()=>location.href="../");
loadRooms();
setInterval(loadRooms,5000);
</script>
</body>
</html>
