<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Neon Core</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#fff;font-family:Arial,sans-serif}
body{display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#10233b 0,#050811 45%,#02040a 100%)}
.card{width:min(440px,92vw);padding:30px 24px;border:1px solid #39e7ff66;border-radius:24px;background:rgba(5,10,20,.92);box-shadow:0 20px 80px #000;text-align:center}
h1{margin:0;color:#39e7ff;font-size:42px;letter-spacing:5px;text-shadow:0 0 24px #39e7ff66}
p{color:#8ea0b8;margin:10px 0 24px}
button{width:100%;min-height:52px;border:1px solid #39e7ff;border-radius:12px;background:linear-gradient(135deg,#12344b,#1a5b74);color:#fff;font-weight:900;font-size:16px;letter-spacing:1px;cursor:pointer;box-shadow:0 0 20px #39e7ff22}
small{display:block;margin-top:14px;color:#5f7088;font-size:10px;letter-spacing:1px}
</style>
</head>
<body>
<main class="card">
<h1>NEON CORE</h1>
<p>Entra al mundo multijugador.</p>
<button id="play">JUGAR</button>
<small>V85</small>
</main>
<script>
(function(){
  var play=document.getElementById("play");
  play.addEventListener("click",function(){
    var u=new URL("neoncore/12345/",location.href);
    u.searchParams.set("neon_cache","V85-"+Date.now());
    location.replace(u.href);
  });
})();
</script>
</body>
</html>
