<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NEON CORE · ACTUALIZANDO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#fff;font-family:Arial,sans-serif}
body{display:grid;place-items:center}
.card{width:min(420px,92vw);padding:28px 22px;background:linear-gradient(180deg,#0b1425,#050b14);border:1px solid #39e7ff88;border-radius:20px;box-shadow:0 20px 80px #000;text-align:center}
.spinner{width:38px;height:38px;margin:0 auto 16px;border:4px solid #24334b;border-top-color:#39e7ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;color:#39e7ff;font-size:23px;letter-spacing:2px}
p{margin:10px 0 0;color:#c8d3e5;font-size:13px;line-height:1.5}
small{display:block;margin-top:10px;color:#71819a;font-size:10px}
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <h1>ACTUALIZANDO NEON CORE</h1>
  <p id="status">Comprobando la versión global…</p>
  <small>GitHub · Render · Base de datos · Cliente</small>
</div>
<script>
(async function(){
  const RAW="https://raw.githubusercontent.com/misael546/NeonCore/main/";
  const fallbackPath="neoncore/12345/v1/index.html";
  const nameKey="neon_core_player_name";
  function status(t){const e=document.getElementById("status");if(e)e.textContent=t;}
  function cb(u){return u+(u.includes("?")?"&":"?")+"t="+Date.now()+"-"+Math.random().toString(36).slice(2);}
  async function get(u){const r=await fetch(cb(u),{cache:"no-store",});if(!r.ok)throw new Error(String(r.status));return r;}
  try{
    const manifest=await (await get(RAW+"release.json")).json();
    const target=String(manifest.clientBuild||manifest.releaseId||"");
    const clientPath=String(manifest.clientPath||fallbackPath).replace(/^\//,"");
    if(!target)throw new Error("release vacío");
    status("Descargando la versión global más reciente…");
    const html=await (await get(RAW+clientPath)).text();
    const m=html.match(/window\.NEON_CORE_BUILD\s*=\s*"([^"]+)"/);
    if(!m||String(m[1])!==target)throw new Error("cliente desfasado");
    let name="";
    try{name=String(new URL(location.href).searchParams.get("name")||"").trim().slice(0,20);}catch{}
    if(!name){try{name=String(localStorage.getItem(nameKey)||"").trim().slice(0,20);}catch{}}
    const query=name?"?name="+encodeURIComponent(name)+"&neon_release="+encodeURIComponent(target)+"&neon_force="+Date.now(): "?neon_release="+encodeURIComponent(target)+"&neon_force="+Date.now();
    try{history.replaceState({},"","../../"+clientPath+query);}catch{}
    status("Instalando automáticamente la build "+target+"…");
    document.open();document.write(html);document.close();
  }catch(e){
    // Nunca bloqueamos al jugador en esta pantalla: el siguiente intento usa
    // una URL única y, si GitHub Raw falla temporalmente, entra directo a v1.
    status("Actualización no disponible. Reintentando automáticamente…");
    setTimeout(()=>{
      try{
        const u=new URL("./v1/index.html",location.href);
        const name=String(new URL(location.href).searchParams.get("name")||"").trim().slice(0,20);
        if(name)u.searchParams.set("name",name);
        u.searchParams.set("neon_force",String(Date.now()));
        location.replace(u.toString());
      }catch{
        location.reload();
      }
    },1200);
  }
})();
</script>
</body>
</html>
